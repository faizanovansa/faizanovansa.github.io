<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @media (prefers-color-scheme: dark) {
                .icon-bg { fill: #070B1A; }
                .icon-primary { fill: #2563EB; }
                .icon-accent { fill: #60A5FA; }
                .icon-text { fill: #F8FAFC; }
            }
            @media (prefers-color-scheme: light) {
                .icon-bg { fill: #F8FAFC; }
                .icon-primary { fill: #2563EB; }
                .icon-accent { fill: #60A5FA; }
                .icon-text { fill: #070B1A; }
            }
        </style>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="64" height="64" class="icon-bg" rx="16"/>
    
    <!-- Gradient Circle -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="url(#gradient)" stroke-width="2" opacity="0.3"/>
    
    <!-- Main Letter F -->
    <g transform="translate(20, 18)">
        <!-- Vertical line -->
        <line x1="6" y1="4" x2="6" y2="28" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Top horizontal line -->
        <line x1="6" y1="4" x2="16" y2="4" stroke="url(#gradient)" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Middle horizontal line -->
        <line x1="6" y1="14" x2="14" y2="14" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>
    
    <!-- Decorative dots -->
    <circle cx="48" cy="28" r="2.5" class="icon-accent" opacity="0.6"/>
    <circle cx="48" cy="36" r="2.5" class="icon-accent" opacity="0.4"/>
</svg>
